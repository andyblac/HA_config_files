- cover:
    - unique_id: 872520ae-ba0b-40ca-bfe4-fcb18474de78
      name: Kitchen Window Shade
      device_class: shade
      open_cover:
        - condition: state
          entity_id: sensor.kitchen_shade_helper
          state: closed
        - action: cover.open_cover
          target:
            entity_id: cover.kitchen_somfy_window_shade
      close_cover:
        - condition: state
          entity_id: sensor.kitchen_shade_helper
          state: open
        - action: cover.close_cover
          target:
            entity_id: cover.kitchen_somfy_window_shade
      stop_cover:
        - action: cover.stop_cover
          target:
            entity_id: cover.kitchen_somfy_window_shade
      default_entity_id: cover.kitchen_window_shade
      availability: "{{ states('sensor.kitchen_shade_helper') in ['open', 'opening', 'closed', 'closing'] }}"
      icon: >
        {%- set shade_state = states('sensor.kitchen_shade_helper') -%}
        {%- if shade_state == 'opening' -%}
          mdi:arrow-up-box
        {%- elif shade_state == 'closing' -%}
          mdi:arrow-down-box
        {%- elif shade_state == 'closed' -%}
          phu:shutter-100
        {%- else -%}
          phu:shutter-20
        {%- endif -%}
      state: >
        {%- set shade_state = states('sensor.kitchen_shade_helper') -%}
        {{ shade_state if shade_state in ['open', 'opening', 'closed', 'closing'] else 'closed' }}

