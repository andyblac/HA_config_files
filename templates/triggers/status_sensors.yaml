# Battery levels do not need sub-second updates. One shared scan per minute
# replaces the previous three domain scans per sensor state change.
- triggers:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: homeassistant
      event: start
  sensor:
    - name: "Devices with low battery"
      unique_id: e9da96dc-aa51-47c1-8a6d-435de1ce5149
      state_class: measurement
      variables:
        summary: >
          {% from 'tools.jinja' import low_battery_summary %}
          {{ low_battery_summary(
              states.sensor,
              battery_level=20,
              exclude_label='Ignore from Status Sensor',
              reject='iphone'
            ) }}
      state: >
        {% set data = summary if summary is mapping else summary | from_json %}
        {{ data.count }}
      attributes:
        navigation: "#batteries"
        entities: >
          {% set data = summary if summary is mapping else summary | from_json %}
          {{ data.entities }}
      icon: >
        {% set data = summary if summary is mapping else summary | from_json %}
        {{ 'mdi:battery-alert'
            if data.count > 0 else 'mdi:battery-outline' }}
