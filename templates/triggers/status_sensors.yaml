# Each status sensor reacts immediately to relevant state_changed events.
# Its variables are evaluated once per trigger and reused by every property.

- triggers:
    - trigger: event
      event_type: state_changed
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: >
        {% set entity_id = trigger.event.data.entity_id
            if trigger.platform == 'event' else '' %}
        {{ trigger.platform == 'homeassistant'
            or entity_id.startswith('light.') }}
  sensor:
    - name: "Number of Lights On"
      unique_id: 3b279d97-e05a-4c8b-9368-2ce58d7fd46c
      state_class: measurement
      variables:
        summary: >
          {% from 'tools.jinja' import entity_summary %}
          {{ entity_summary(
              states.light,
              state='on',
              exclude_label='Ignore from Status Sensor'
            ) }}
      state: >
        {% set data = summary if summary is mapping else summary | from_json %}
        {{ data.count }}
      attributes:
        navigation: "#lights-on"
        label: >
          {% set data = summary if summary is mapping else summary | from_json %}
          {{ data.count ~ ' On' if data.count > 0 else 'All Off' }}
        entities: >
          {% set data = summary if summary is mapping else summary | from_json %}
          {{ data.entities | to_json }}
        count: >
          {% set data = summary if summary is mapping else summary | from_json %}
          {{ data.areas }}
      icon: >
        {% set data = summary if summary is mapping else summary | from_json %}
        {{ 'mdi:lightbulb-group'
            if data.count > 0 else 'mdi:lightbulb-group-outline' }}


- triggers:
    - trigger: event
      event_type: state_changed
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: >
        {% if trigger.platform == 'homeassistant' %}
          true
        {% else %}
          {% set changed =
              trigger.event.data.new_state
              or trigger.event.data.old_state %}
          {{ changed is not none
              and changed.entity_id.startswith('switch.')
              and changed.attributes.device_class | default('') == 'outlet' }}
        {% endif %}
  sensor:
    - name: "Number of Sockets On"
      unique_id: c838cee8-1919-4000-8fc0-d6587433e6fc
      state_class: measurement
      variables:
        summary: >
          {% from 'tools.jinja' import entity_summary %}
          {{ entity_summary(
              states.switch,
              device_class='outlet',
              state='on',
              exclude_label='Ignore from Status Sensor',
              exclude_summary_area='House'
            ) }}
      state: >
        {% set data = summary if summary is mapping else summary | from_json %}
        {{ data.count }}
      attributes:
        navigation: "#sockets-on"
        label: >
          {% set data = summary if summary is mapping else summary | from_json %}
          {{ data.count ~ ' On' if data.count > 0 else 'All Off' }}
        entities: >
          {% set data = summary if summary is mapping else summary | from_json %}
          {{ data.entities | to_json }}
        count: >
          {% set data = summary if summary is mapping else summary | from_json %}
          {{ data.areas }}
      icon: mdi:power-socket-uk


