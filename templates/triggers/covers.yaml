- triggers:
    - trigger: state
      entity_id: cover.kitchen_somfy_window_shade
  sensor:
    - name: Kitchen Shade Helper
      unique_id: b93e4cd1-d994-4699-91f8-4e6a8022bf0c
      state: >
        {% if trigger.to_state.state == 'opening' %}
          opening
        {% elif trigger.to_state.state == 'closing' %}
          closing
        {% elif trigger.from_state.state == 'opening'
              and trigger.to_state.state == 'unknown' %}
          open
        {% elif trigger.from_state.state == 'closing'
              and trigger.to_state.state == 'unknown' %}
          closed
        {% else %}
          {{ this.state }}
        {% endif %}

