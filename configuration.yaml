panel_custom:
  # - name: Supervisor
  #   url_path: hassio/system
  #   sidebar_title: Supervisor
  #   sidebar_icon: mdi:home-assistant
  #   module_url: /local/panel-redirect.js
  - name: Add-ons
    url_path: config/apps/installed
    sidebar_title: Apps
    sidebar_icon: mdi:puzzle
    module_url: /api/hassio/app/entrypoint.js
  - name: panel_automations
    sidebar_title: Automations
    sidebar_icon: mdi:cogs
    url_path: "config/automation"
    module_url: /api/hassio/app/entrypoint.js
    embed_iframe: true
    require_admin: true
  - name: panel_backups
    sidebar_title: Backups
    sidebar_icon: mdi:backup-restore
    url_path: "config/backup"
    module_url: /api/hassio/app/entrypoint.js
    embed_iframe: true
    require_admin: true
  - name: panel_integrations
    sidebar_title: Integrations
    sidebar_icon: mdi:audio-input-rca
    url_path: "config/integrations"
    module_url: /api/hassio/app/entrypoint.js
    embed_iframe: true
    require_admin: true
