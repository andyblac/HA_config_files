title: Back Garden
path: back-garden
icon: mdi:flower-tulip
cards:
  - type: vertical-stack
    cards:
      - type: custom:mushroom-chips-card
        chips:
          - type: back
          - type: entity
            entity: binary_sensor.back_door
            content_info: none
            tap_action:
              action: more-info
          - type: template
            icon: mdi:motion-sensor
            content: ""
            icon_color: "{{ 'blue' if is_state('binary_sensor.back_garden_motion_sensor_occupancy', 'on') }}"
            entity: binary_sensor.back_garden_motion_sensor_occupancy
            tap_action:
              action: more-info
          - type: template
            icon: mdi:lightbulb
            content: "{{ state_attr('sensor.number_of_lights_on', 'count')['Back Garden'] }}"

      - type: custom:tabbed-card
        tabs:
          - attributes:
              label: Temperature
            card:
              type: custom:mini-graph-card
              points_per_hour: 2
              entities:
                - entity: sensor.back_garden_motion_sensor_temperature
                  name: Temperature
          - attributes:
              label: Humidity
            card:
              type: custom:mini-graph-card
              points_per_hour: 2
              lower_bound: 0
              upper_bound: 100
              entities:
                - entity: sensor.back_garden_soil_sensor_humidity
                  name: Humidity
                  color: "#03a9f4"
          - attributes:
              label: Lux
            card:
              type: custom:mini-graph-card
              points_per_hour: 2
              entities:
                - entity: sensor.back_garden_motion_sensor_illuminance_lux
                  name: Humidity
                  color: "#33cc33"
      - type: horizontal-stack
        cards:
          - type: tile
            entity: light.garage_wall_light
            vertical: true
          - type: tile
            entity: light.back_garden_neon_rope
            vertical: true
      - type: tile
        name: Sprinkler
        entity: switch.back_garden_water_control
        vertical: true
        color: blue
