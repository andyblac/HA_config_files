type: custom:auto-entities
card:
  type: entities
  show_header_toggle: false
  state_color: false
  card_mod:
    style:
      .: |
        ha-card: {
          --ha-card-background: none;
          box-shadow: none;
        }
        .card-content {
          padding-top: 0px !important;
          padding-bottom: 0px !important;
        }
      hui-toggle-entity-row:
        $: |
          hui-generic-entity-row {
            height: 25px;
          }
show_empty: false
filter:
  include:
    - attributes:
        device_class: power
        unit_of_measurement: W
      state: '>0'
  exclude: []
sort:
  method: state
  reverse: true
  numeric: true
