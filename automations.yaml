          - cover.office_window_shade
          - cover.spare_bedroom_window_shade
        options:
          behavior: any
      - condition: template
        value_template: '{{ repeat.index <= 5 }}'
      sequence:
      - action: cover.open_cover
        target:
          entity_id:
          - cover.kitchen_somfy_window_shade
          - cover.lounge_somfy_patio_window_shade
          - cover.media_room_somfy_window_shade
          - cover.office_somfy_window_shade
          - cover.spare_bedroom_somfy_window_shade
        continue_on_error: true
        data: {}
      - if:
        - condition: template
          value_template: '{{ 5 <= now().month <= 8 }}'
        then:
        - action: cover.open_cover
          target:
            entity_id:
            - cover.lounge_window_shade
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ repeat.index < 5 }}'
        then:
        - delay:
            minutes: 5
  - condition: template
    value_template: '{{ now().month >= 9 or now().month <= 4 }}

