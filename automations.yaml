- id: '1680434611408'
  alias: House Alarm State Changes
  description: Activate scene based on Alarm State.
  triggers:
  - entity_id:
    - alarm_control_panel.house_alarm
    to: armed_away
    id: armed away
    trigger: state
  - entity_id:
    - alarm_control_panel.house_alarm
    to: disarmed
    id: disarmed
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - armed away
      sequence:
      - condition: time
        after: '21:30:00'
        before: 07:00:00
      - action: script.good_night
        metadata: {}
        data: {}
    - conditions:
      - condition: trigger
        id:
        - disarmed
      sequence:
      - condition: time
        after: 07:00:00
        before: 09:30:00
      - action: script.good_morning
        metadata: {}
        data: {}
    enabled: true
  mode: single
- id: '1680538297612'
  alias: Garage Alarm Button
  description: Arm / Disarm Garage
  use_blueprint:
    path: rdeangel/zigbee2mqtt-sonoff-1-button-switch-mqtt-device-trigger_rdeangel.yaml
    input:
      zigbee_device: 2acaf72336d7fd4200e2b48a8659e3b4
      single_press:
      - action: alarm_control_panel.alarm_arm_away
        target:
          entity_id: alarm_control_panel.garage_alarm
        metadata: {}
        data: {}
      long_press:
      - choose:
        - conditions:
          - condition: state
            entity_id: cover.garage_roller_door
            state: closed
          sequence:
          - action: alarm_control_panel.alarm_disarm
            metadata: {}
            data: {}
            target:
              entity_id: alarm_control_panel.garage_alarm
          - if:
            - condition: state
              entity_id: switch.garage_roller_door_switch
              state: 'off'
            then:
            - action: switch.turn_on
              metadata: {}
              data: {}
              target:
                entity_id: switch.garage_roller_door_switch
            - delay:
                hours: 0
                minutes: 0
                seconds: 5
                milliseconds: 0
          - action: cover.open_cover
            metadata: {}
            data: {}
            target:
              entity_id: cover.garage_roller_door
        - conditions:
          - condition: state
            entity_id: cover.garage_roller_door
            state: open
          sequence:
          - action: cover.close_cover
            metadata: {}
            data: {}
            target:
              entity_id: cover.garage_roller_door
          - delay:
              hours: 0
              minutes: 1
              seconds: 0
              milliseconds: 0
          - action: switch.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: switch.garage_roller_door_switch
      double_press:
      - action: alarm_control_panel.alarm_disarm
        metadata: {}
        data: {}
        target:
          entity_id: alarm_control_panel.garage_alarm
