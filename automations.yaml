- id: '1680619745222'
  alias: Andys Bedroom Door Opens
  description: Turn On Lights
  triggers:
  - entity_id:
    - binary_sensor.andys_bedroom_contact_sensor_door
    to: 'on'
    from: 'off'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.evening
    state: 'on'
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.evening
      state: 'on'
    - condition: time
      after: '17:30:00'
      weekday:
      - sun
      before: '19:30:00'
    then:
    - condition: state
      entity_id: light.andys_bedroom_lights
      state: 'off'
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 15
      target:
        entity_id: light.andys_bedroom_lights
    - delay:
        hours: 0
        minutes: 15
        seconds: 0
        milliseconds: 0
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: light.andys_bedroom_lights
    else:
    - if:
      - condition: state
        entity_id: light.andys_bedroom_lights
        state: 'off'
      then:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 5
        target:
          entity_id: light.andys_bedroom_lights
      else:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.andys_bedroom_lights
  mode: restart
