- id: '1681322393347'
  alias: Alarm Notification
  description: Send Notification when Alarm's are Armed/Disarmed
  triggers:
  - device_id: e3fc54e9d00a383bb2b8d4fcc48621a0
    domain: alarm_control_panel
    entity_id: alarm_control_panel.garage_alarm
    type: armed_away
    trigger: device
  - device_id: e3fc54e9d00a383bb2b8d4fcc48621a0
    domain: alarm_control_panel
    entity_id: alarm_control_panel.garage_alarm
    type: disarmed
    trigger: device
    id: Garage Disarmed
  - device_id: e6cd815aa3d360578c6c3e735fcdd764
    domain: alarm_control_panel
    entity_id: alarm_control_panel.house_alarm
    type: disarmed
    trigger: device
  - device_id: e6cd815aa3d360578c6c3e735fcdd764
    domain: alarm_control_panel
    entity_id: alarm_control_panel.house_alarm
    type: armed_away
    trigger: device
  - device_id: e3fc54e9d00a383bb2b8d4fcc48621a0
    domain: alarm_control_panel
    entity_id: alarm_control_panel.garage_alarm
    type: triggered
    trigger: device
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: alarm_control_panel.garage_alarm
      state: triggered
    then:
    - data:
        message: Is now {{states(trigger.entity_id)|replace('_',' ')|title}}
        title: '{{ trigger.from_state.name if trigger.from_state is not none else
          trigger.to_state.name }}'
        data:
          push:
            sound:
              name: default
              critical: 1
              volume: 1
      action: notify.mobile_app_andys_iphone
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: alarm_control_panel.garage_alarm
        state: triggered
    then:
    - data:
        message: Is now {{states(trigger.entity_id)|replace('_',' ')|title}}
        title: '{{ trigger.from_state.name if trigger.from_state is not none else
          trigger.to_state.name }}'
      action: notify.mobile_app_andys_iphone
    - data:
        message: Is now {{states(trigger.entity_id)|replace('_',' ')|title}}
        title: '{{ trigger.from_state.name if trigger.from_state is not none else
          trigger.to_state.name }}'
      action: notify.mobile_app_andrews_imac
      enabled: true
  mode: restart
