- id: '1776427563071'
  alias: "\U0001F335\U0001F339 Water Plants - Seasonal Low Soil Moisture"
  description: Sends a notification when either the indoor Christmas cactus or outdoor
    rose tree soil moisture drops below its seasonal watering threshold for North
    East England.
  triggers:
  - trigger: time
    at: 09:00:00
  conditions:
  - condition: template
    value_template: "{{\n  states('sensor.lounge_christmas_cactus_soil_sensor_soil_moisture')
      | float(999)\n  < christmas_cactus_threshold | float\n  or\n  states('sensor.back_garden_rose_tree_soil_moisture')
      | float(999)\n  < rose_tree_threshold | float\n}}"
  actions:
  - if:
    - condition: template
      value_template: "{{\n  states('sensor.lounge_christmas_cactus_soil_sensor_soil_moisture')
        | float(999)\n  < christmas_cactus_threshold | float\n}}"
    then:
    - action: notify.mobile_app_andys_iphone
      data:
        title: "\U0001F335 Time to water the Christmas cactus!"
        message: Soil moisture is {{ states('sensor.lounge_christmas_cactus_soil_sensor_soil_moisture')
          }}%. Threshold is {{ christmas_cactus_threshold | float | round(0) }}% for
          {{ christmas_cactus_season }}. Water thoroughly until it drains.
    - action: persistent_notification.create
      data:
        title: "\U0001F335 Christmas Cactus Watering Reminder"
        message: 'Soil moisture is **{{ states(''sensor.lounge_christmas_cactus_soil_sensor_soil_moisture'')
          }}%**.<br><br> Season: {{ christmas_cactus_season }}<br> Watering threshold:
          {{ christmas_cactus_threshold | float | round(0) }}%<br> Target after watering:
          35–55%'
        notification_id: christmas-cactus-low-moisture
  - if:
    - condition: template
      value_template: "{{\n  states('sensor.back_garden_rose_tree_soil_moisture')
        | float(999)\n  < rose_tree_threshold | float\n}}"
    then:
    - action: notify.mobile_app_andys_iphone
      data:
        title: "\U0001F339 Time to water the rose tree!"
        message: Soil moisture is {{ states('sensor.back_garden_rose_tree_soil_moisture')
          }}%. Threshold is {{ rose_tree_threshold | float | round(0) }}% for {{ rose_tree_season
          }}. Water deeply only if the top soil is dry.
    - action: persistent_notification.create
      data:
        title: "\U0001F339 Rose Tree Watering Reminder"
        message: 'Soil moisture is **{{ states(''sensor.back_garden_rose_tree_soil_moisture'')
          }}%**.<br><br> Season: {{ rose_tree_season }}<br> Watering threshold: {{
          rose_tree_threshold | float | round(0) }}%<br> Target after watering: 40–60%'
        notification_id: rose-tree-low-moisture
  variables:
    month: '{{ now().month }}'
    christmas_cactus_threshold: "{% if month in [3,4,5,6,7,8] %}\n  40\n{% elif month
      in [9,10,11] %}\n  32\n{% else %}\n  28\n{% endif %}"
    christmas_cactus_season: "{% if month in [3,4,5,6,7,8] %}\n  Mar–Aug active growth\n{%
      elif month in [9,10,11] %}\n  Sep–Nov bud/flowering prep\n{% else %}\n  Dec–Feb
      cooler/resting period\n{% endif %}"
    rose_tree_threshold: "{% if month in [3,4,5] %}\n  40\n{% elif month in [6,7,8]
      %}\n  45\n{% elif month in [9,10] %}\n  38\n{% else %}\n  25\n{% endif %}"
    rose_tree_season: "{% if month in [3,4,5] %}\n  Mar–May spring growth\n{% elif
      month in [6,7,8] %}\n  Jun–Aug warm/drier period\n{% elif month in [9,10] %}\n
      \ Sep–Oct autumn\n{% else %}\n  Nov–Feb dormant/cool/wet period\n{% endif %}"
  mode: single
- id: '1782472458615'
  alias: Unavailable Entities Alert
  description: ''
  triggers:
  - trigger: state
    entity_id: sensor.unavailable_entities
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ offline_count > 0 }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ not quiet_hours }}'
        then:
        - action: notify.mobile_app_andys_iphone
          data:
            title: ⚠️ Entities Offline
            message: '{{ message }}'
            data:
              url: /dashboard-main/home#unavailable-entities
              push:
                sound:
                  name: default
                  critical: 0
                  volume: 1
        - action: notify.mobile_app_andrews_imac
          data:
            title: ⚠️ Entities Offline
            message: '{{ message }}'
            data:
              url: /dashboard-main/home#unavailable-entities
      - action: persistent_notification.create
        data:
          title: ⚠️ Entities Offline
          message: '{{ message }}'
          notification_id: unavailable_entities_alert
    - conditions:
      - condition: template
        value_template: '{{ offline_count == 0 }}'
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: unavailable_entities_alert
      - if:
        - condition: template
          value_template: '{{ not quiet_hours }}'
        then:
        - action: notify.mobile_app_andys_iphone
          data:
            title: ✅ Entities Back Online
            message: All monitored entities are back online.
        - action: notify.mobile_app_andrews_imac
          data:
            title: ✅ Entities Back Online
            message: All monitored entities are back online.
  mode: single
  variables:
    offline_count: '{{ states(''sensor.unavailable_entities'') | int(0) }}'
    offline_entities: '{{ state_attr(''sensor.unavailable_entities'', ''entities'')
      | default([], true) }}

      '
    offline_list: '{% for item in offline_entities %}

      • {{ state_attr(item.entity_id, ''friendly_name'') or item.entity_id }}

      {% endfor %}

      '
    message: '{{ offline_count }} entities are offline.


      {{ offline_list }}

      '
    quiet_hours: '{{ now().hour >= 22 or now().hour < 7 }}'
